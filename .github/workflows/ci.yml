name: Local validation
on: [push, pull_request]
concurrency:
  group: local-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNISEEK_ALLOW_CLOUD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked
      - run: uv run ruff check src modal_apps scripts tests
      - run: uv run ruff format --check src modal_apps scripts tests
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python -m omniseek_multimodal.cli demo
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
