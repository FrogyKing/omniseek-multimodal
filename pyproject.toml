[project]
name = "omniseek-multimodal"
version = "0.1.0"
description = "Local-first multimodal semantic search with EmbeddingGemma 2 and on-demand Modal GPUs"
readme = "README.md"
authors = [
    { name = "Luis Gonzalez", email = "luisgonzalezalvarez991@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av==19.0.2",
    "faiss-cpu>=1.15.1",
    "fastapi==0.162.0",
    "modal>=1.6.2",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "portalocker>=3.2",
    "python-multipart>=0.0.20",
    "soundfile==0.14.0",
    "uvicorn>=0.38",
]

[project.scripts]
omniseek-multimodal = "omniseek_multimodal:main"
omniseek = "omniseek_multimodal.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: explicitly billable Modal integration tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/omniseek_multimodal"]
